<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c1326" />
      <stop offset="45%" stop-color="#0e0a17" />
      <stop offset="100%" stop-color="#050308" />
    </radialGradient>

    <!-- Fiery Outer Flame Gradient -->
    <linearGradient id="fireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="90%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Fiery Core Flame Gradient -->
    <linearGradient id="fireCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Cyber Nexus Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Fire Glow Filter -->
    <filter id="fieryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Squircle Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-opacity="0.5" />

  <!-- Background Ambient Ember Glow -->
  <circle cx="256" cy="270" r="160" fill="#f97316" opacity="0.18" filter="url(#intenseGlow)" />
  <circle cx="256" cy="230" r="90" fill="#fde047" opacity="0.22" filter="url(#fieryGlow)" />

  <!-- Cyber Hub Orbital Nexus Ring (Hexagonal Topology) -->
  <g opacity="0.75" stroke="url(#ringGrad)" stroke-width="2.5" fill="none">
    <!-- Orbital Nodes Ring -->
    <polygon points="256,96 390,174 390,330 256,408 122,330 122,174" stroke-dasharray="10 6" opacity="0.6" />
    <!-- Connector cross rays -->
    <line x1="256" y1="96" x2="256" y2="408" opacity="0.3" />
    <line x1="122" y1="174" x2="390" y2="330" opacity="0.3" />
    <line x1="122" y1="330" x2="390" y2="174" opacity="0.3" />
  </g>

  <!-- Hexagonal Hub Vertices (Service Nodes) -->
  <g fill="#f59e0b">
    <circle cx="256" cy="96" r="7" filter="url(#fieryGlow)" fill="#fde047" />
    <circle cx="390" cy="174" r="6" filter="url(#fieryGlow)" fill="#fb923c" />
    <circle cx="390" cy="330" r="6" filter="url(#fieryGlow)" fill="#f87171" />
    <circle cx="256" cy="408" r="7" filter="url(#fieryGlow)" fill="#ef4444" />
    <circle cx="122" cy="330" r="6" filter="url(#fieryGlow)" fill="#f87171" />
    <circle cx="122" cy="174" r="6" filter="url(#fieryGlow)" fill="#fb923c" />
  </g>

  <!-- Big Fiery Hub Emblem: Outer Dynamic Flame -->
  <path d="M 256,76
           C 285,130 335,160 360,220
           C 388,285 365,360 310,398
           C 285,415 256,420 230,412
           C 265,380 275,340 255,305
           C 240,280 205,270 205,230
           C 205,195 230,160 235,130
           C 240,105 248,88 256,76 Z"
        fill="url(#fireOuter)"
        filter="url(#intenseGlow)" />

  <!-- Secondary Leaping Flame Crest -->
  <path d="M 235,145
           C 220,185 180,215 165,260
           C 145,315 168,375 220,405
           C 170,370 160,310 185,265
           C 202,232 235,210 235,145 Z"
        fill="#f97316"
        opacity="0.9" />

  <!-- Inner Radiant Core Flame -->
  <path d="M 256,150
           C 275,190 308,225 315,268
           C 325,320 290,360 256,375
           C 280,345 285,308 268,280
           C 255,260 235,248 236,218
           C 237,190 248,168 256,150 Z"
        fill="url(#fireCore)"
        filter="url(#fieryGlow)" />

  <!-- Center Fiery Hub Heart (White-Hot Spark Nexus) -->
  <ellipse cx="260" cy="295" rx="20" ry="32" fill="#ffffff" opacity="0.95" filter="url(#fieryGlow)" />
  <circle cx="260" cy="295" r="10" fill="#fef08a" />

  <!-- Rising Dynamic Embers & Sparks -->
  <circle cx="280" cy="115" r="4.5" fill="#fde047" filter="url(#fieryGlow)" />
  <circle cx="190" cy="180" r="3.5" fill="#f59e0b" />
  <circle cx="340" cy="190" r="4" fill="#fb923c" filter="url(#fieryGlow)" />
  <circle cx="330" cy="130" r="3" fill="#fef08a" />
  <circle cx="210" cy="120" r="3" fill="#fde047" />
</svg>

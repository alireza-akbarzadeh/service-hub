		function number_format(number) {
			number = number.toString();

			var number_arr = number.split('.');
			number = number_format_part2(number_arr[0]);
			if ( number_arr[1] ) number += '.'+number_arr[1].substr(0,2);

			return number;
		}

		function number_format_part2(number, decimals, decPoint, thousandsSep) {
			number = (number + '').replace(/[^0-9+\-Ee.]/g, '')
			var n = !isFinite(+number) ? 0 : +number
			var prec = !isFinite(+decimals) ? 0 : Math.abs(decimals)
			var sep = (typeof thousandsSep === 'undefined') ? ',' : thousandsSep
			var dec = (typeof decPoint === 'undefined') ? '.' : decPoint
			var s = ''

			var toFixedFix = function (n, prec) {
				var k = Math.pow(10, prec)
				return '' + (Math.round(n * k) / k)
					.toFixed(prec)
			}

			// @todo: for IE parseFloat(0.55).toFixed(0) = 0;
			s = (prec ? toFixedFix(n, prec) : '' + Math.round(n)).split('.')
			if (s[0].length > 3) {
				s[0] = s[0].replace(/\B(?=(?:\d{3})+(?!\d))/g, sep)
			}
			if ((s[1] || '').length < prec) {
				s[1] = s[1] || ''
				s[1] += new Array(prec - s[1].length + 1).join('0')
			}

			return s.join(dec)
		}

        <script>
            (function () {

                let sliderInterval = null;
            
                function initSlider() {
            
                    const slider = document.querySelector('.top-alert-slider');
            
                    if (!slider) return false;
            
                    const slides = slider.querySelectorAll('.sld');
            
                    if (slides.length === 0) return false;
            
                    // جلوگیری از دوبار اجرا شدن
                    if (slider.dataset.initialized) return true;
                    slider.dataset.initialized = "1";
            
                    let index = 0;
            
                    function showNextSlide() {
                        slides.forEach(slide => slide.classList.remove('active-slider-item'));
                        slides[index].classList.add('active-slider-item');
                        index = (index + 1) % slides.length;
                    }
            
                    showNextSlide();
                    sliderInterval = setInterval(showNextSlide, 10000);
            
                    return true;
                }
            
                const checker = setInterval(() => {
                    if (initSlider()) {
                        clearInterval(checker);
                    }
                }, 500);
            
            })();
        </script>
